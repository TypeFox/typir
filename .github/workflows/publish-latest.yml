name: Publish `latest`

permissions:
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
  pull_request:
    branches:
      - main
    paths:
      - '**/package.json'

jobs:
  publish:
    name: Typir Publish `latest`
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Use MISE config to install the required Node version
      uses: jdx/mise-action@v4
      with:
        version: v2026.8.16
    - name: Build
      shell: bash
      run: |
        npm i -g npm
        npm ci
        npm run clean
        npm run build
    - name: Test
      if: success() || failure()
      shell: bash
      run: |
        npm run test:run
    - name: Publish
      uses: TypeFox/gh-publish-npm@7183224bef010236e419a2367208633ff284337a # v0.5.0
      with:
        dry-run: ${{ github.event_name == 'pull_request' }}
        npm-packages: |
          packages/typir
          packages/typir-langium
          examples/expression
          examples/lox
          examples/ox
